{% load static %}
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Lang Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'exercicio/exercise_builder.css' %}" />
  </head>
  <body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center" data-api-base-url="/api/v1">
      <section class="panel w-100" style="max-width: 420px">
        <p class="text-uppercase text-primary small fw-semibold mb-1">Lang Admin</p>
        <h1 class="h3 mb-4">Entrar no criador</h1>
        <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>
        <form id="loginForm" class="vstack gap-3">
          <label class="form-label mb-0">Usuario
            <input id="username" name="username" class="form-control mt-1" autocomplete="username" required autofocus />
          </label>
          <label class="form-label mb-0">Senha
            <input id="password" name="password" class="form-control mt-1" type="password" autocomplete="current-password" required />
          </label>
          <button id="loginButton" class="btn btn-primary" type="submit">Entrar</button>
        </form>
      </section>
    </main>
    <script src="{% static 'exercicio/exercise_builder_login.js' %}"></script>
  </body>
</html>
